<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Authenticator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">

            <h2 class="mb-3">Setup Google Authenticator</h2>

            <p>Scan this QR code using Google Authenticator.</p>

            <p>
                Account:
                <strong th:text="${email}"></strong>
            </p>

            <div class="my-4">
                <img th:src="${qrCode}" alt="Authenticator QR Code">
            </div>

            <p>
                Enter the 6-digit OTP generated by Google Authenticator.
            </p>

            <form th:action="@{/verify-otp}" method="post">

                <div class="mb-3">
                    <input type="text"
                           name="code"
                           class="form-control form-control-lg text-center"
                           placeholder="Enter 6-digit OTP"
                           maxlength="6"
                           required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg">
                    Verify OTP
                </button>

            </form>

            <p class="text-danger mt-3" th:if="${error}" th:text="${error}"></p>

        </div>
    </div>
</div>

</body>
</html>
