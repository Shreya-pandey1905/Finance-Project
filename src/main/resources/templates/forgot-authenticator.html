<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Authenticator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card p-4">

                <h2 class="text-center mb-3">
                    Reset Authenticator
                </h2>

                <p class="text-center">
                    Enter your registered email address.
                </p>

                <form th:action="@{/forgot-authenticator/send-otp}"
                      method="post">

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="Enter your email"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Send OTP
                    </button>

                </form>

                <p class="text-danger mt-3"
                   th:if="${error}"
                   th:text="${error}">
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
